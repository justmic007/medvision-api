services:
  db:
    image: postgres:16
    container_name: medvision-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medvision}
      POSTGRES_USER: ${POSTGRES_USER:-medvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medvision_dev}
    ports:
      - "5432:5432"
    volumes:
      - medvision_pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready reports true readiness, not just container start.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medvision} -d ${POSTGRES_DB:-medvision}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    container_name: medvision-api
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=MedVision AI
      # In-container the app reaches Postgres by the service name 'db', not localhost.
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-medvision}:${POSTGRES_PASSWORD:-medvision_dev}@db:5432/${POSTGRES_DB:-medvision}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  medvision_pgdata:

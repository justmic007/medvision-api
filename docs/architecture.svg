<svg width="100%" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>MedVision AI current architecture</title>
  <desc>An authenticated FastAPI backend: auth and clinical-workflow layer around a deterministic analysis core, backed by Postgres and object storage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="28" font-size="12" fill="#5F5E5A">Clinician / API client</text>
  <rect x="40" y="36" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="130" y="58" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Upload + auth token</text>
  <line x1="130" y1="80" x2="130" y2="106" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="30" y="108" width="620" height="150" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="50" y="130" font-size="14" font-weight="500" fill="#0C447C">Auth + clinical workflow (FastAPI)</text>
  <text x="50" y="148" font-size="12" fill="#185FA5">JWT, roles, per-clinician ownership</text>
  <rect x="55" y="166" width="180" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="145" y="190" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">Auth</text>
  <text x="145" y="210" font-size="12" fill="#0F6E56" text-anchor="middle">register, verify, approve</text>
  <rect x="250" y="166" width="180" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="190" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">Patients + cases</text>
  <text x="340" y="210" font-size="12" fill="#0F6E56" text-anchor="middle">create, list, history</text>
  <rect x="445" y="166" width="180" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="535" y="190" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">Analyze endpoint</text>
  <text x="535" y="210" font-size="12" fill="#0F6E56" text-anchor="middle">upload, persist case</text>

  <line x1="535" y1="258" x2="535" y2="286" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="30" y="288" width="620" height="150" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="50" y="310" font-size="14" font-weight="500" fill="#3C3489">Deterministic analysis core</text>
  <text x="50" y="328" font-size="12" fill="#534AB7">same input, same output</text>
  <rect x="55" y="346" width="135" height="70" rx="10" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="122" y="370" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle">Preprocess</text>
  <text x="122" y="390" font-size="12" fill="#3C3489" text-anchor="middle">to tensor</text>
  <rect x="205" y="346" width="135" height="70" rx="10" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="272" y="370" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle">Classify</text>
  <text x="272" y="390" font-size="12" fill="#3C3489" text-anchor="middle">18 findings</text>
  <rect x="355" y="346" width="135" height="70" rx="10" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="422" y="370" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle">GradCAM</text>
  <text x="422" y="390" font-size="12" fill="#3C3489" text-anchor="middle">heatmap</text>
  <rect x="505" y="346" width="120" height="70" rx="10" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="565" y="370" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle">Literature</text>
  <text x="565" y="390" font-size="12" fill="#3C3489" text-anchor="middle">PubMed</text>

  <line x1="200" y1="466" x2="200" y2="438" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="438" x2="470" y2="466" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="70" y="468" width="240" height="60" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="190" y="490" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Postgres</text>
  <text x="190" y="510" font-size="12" fill="#854F0B" text-anchor="middle">users, patients, cases, audit</text>
  <rect x="360" y="468" width="240" height="60" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="480" y="490" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Object storage</text>
  <text x="480" y="510" font-size="12" fill="#854F0B" text-anchor="middle">MinIO / R2 scans</text>

  <rect x="150" y="558" width="380" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="340" y="580" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">MLflow run tracking + optional VLM</text>
</svg>

<svg width="100%" viewBox="0 0 680 600" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>MedVision AI authenticated analysis flow</title>
  <desc>An authenticated upload is validated, analyzed by the core, then the scan is stored and the result persisted as a case.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="240" y="26" width="200" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="45" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">POST /analyze</text>
  <text x="340" y="63" font-size="12" fill="#5F5E5A" text-anchor="middle">image + patient + token</text>
  <line x1="340" y1="76" x2="340" y2="98" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="240" y="100" width="200" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="119" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Authenticate</text>
  <text x="340" y="137" font-size="12" fill="#185FA5" text-anchor="middle">valid token, owns patient</text>
  <line x1="340" y1="150" x2="340" y2="172" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="240" y="174" width="200" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="193" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle">Preprocess + classify</text>
  <text x="340" y="211" font-size="12" fill="#534AB7" text-anchor="middle">probs + activations</text>

  <path d="M240 199 L150 199 L150 248" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="95" y="225" font-size="12" fill="#534AB7" text-anchor="middle">activations</text>
  <path d="M440 199 L530 199 L530 248" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="585" y="225" font-size="12" fill="#0F6E56" text-anchor="middle">labels only</text>

  <rect x="55" y="250" width="190" height="56" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="150" y="270" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle">GradCAM</text>
  <text x="150" y="288" font-size="12" fill="#3C3489" text-anchor="middle">heatmap per finding</text>
  <rect x="435" y="250" width="190" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="530" y="270" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle">PubMed retrieval</text>
  <text x="530" y="288" font-size="12" fill="#085041" text-anchor="middle">cited abstracts</text>

  <path d="M150 306 L150 340 L243 340" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M530 306 L530 340 L437 340" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="245" y="314" width="190" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="334" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">Assemble result</text>
  <text x="340" y="352" font-size="12" fill="#0F6E56" text-anchor="middle">+ disclaimer</text>
  <line x1="340" y1="366" x2="340" y2="388" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="240" y="390" width="200" height="50" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="340" y="409" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Store scan</text>
  <text x="340" y="427" font-size="12" fill="#854F0B" text-anchor="middle">MinIO / R2, get key</text>
  <line x1="340" y1="440" x2="340" y2="462" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="240" y="464" width="200" height="50" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="340" y="483" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Persist case</text>
  <text x="340" y="501" font-size="12" fill="#854F0B" text-anchor="middle">Postgres, links patient</text>
  <line x1="340" y1="514" x2="340" y2="536" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="240" y="538" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="560" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">JSON response</text>
</svg>
